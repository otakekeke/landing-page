<!doctype html>
<html lang="ja">
<head>
<!-- takenokonoko/sales-demo/build_lp_zaiko.cjs で zaiko-demo.html から作る。ここは直接直さない -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>在庫と注文の見本｜タケノコ</title>
<meta name="description" content="架空の施設と商品で動く、介護施設の在庫と注文のアプリの見本です。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
:root{
  --white:#ffffff; --black:#000000;
  --g50:#f2f2f2; --g100:#e6e6e6; --g200:#cccccc; --g300:#b3b3b3; --g420:#949494; --g600:#666666; --g700:#4d4d4d; --g800:#333333; --g900:#1a1a1a;
  --key-50:#e8f1fe; --key-100:#d9e6ff; --key-200:#c5d7fb; --key-300:#9db7f9; --key-900:#0017c1; --key-1000:#00118f; --key-1200:#000060;
  --ok-1:#259d63; --ok-2:#197a4b; --ok-ink:#115a36; --ok-bg:#e6f5ec;
  --warn-line:#b78f00; --warn-ink:#806300; --warn-bg:#fbf5e0;
  --err-1:#ec0000; --err-ink:#ce0000; --err-bg:#fdeeee;
  --hai-ink:#ac3e00; --hai-bg:#ffeee2;
  --eis-ink:#0066be; --eis-bg:#e8f1fe;
  --sho-ink:#115a36; --sho-bg:#e6f5ec;
  --sou-ink:#4d4d4d; --sou-bg:#f2f2f2;
  --bic-ink:#6f23d0; --bic-bg:#f1eafa;
  --focus:#ffd43d;
  --font:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{min-height:100%;display:flex;flex-direction:column;background:var(--white);color:var(--g800);font-family:var(--font);font-size:16px;line-height:1.7;letter-spacing:.02em;word-break:auto-phrase;line-break:strict;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance;line-height:1.4}
:focus-visible{outline:4px solid var(--black);outline-offset:2px;border-radius:4px;box-shadow:0 0 0 2px var(--focus)}
h1:focus{outline:none;box-shadow:none}
[data-pointer] button:focus-visible,[data-pointer] summary:focus-visible{outline:none;box-shadow:none}
.num{font-variant-numeric:tabular-nums}
.nb{display:inline-block;max-width:100%;overflow-wrap:anywhere}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vh{clip:rect(0 0 0 0);clip-path:inset(50%);height:1px;overflow:hidden;position:absolute;white-space:nowrap;width:1px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1080px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--white)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex:none;background:var(--white);border-bottom:1px solid var(--g420)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.bar b{font-size:18px;line-height:1.3}
.bar span{color:var(--g700)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:48px;margin-left:-8px;padding:0 12px 0 4px;border:0;border-radius:8px;background:none;color:var(--key-900);font-size:17px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (hover:hover){.back:hover{background:var(--key-50);text-decoration-thickness:3px}}
main{flex:1 0 auto}
.view{display:flex;flex-direction:column;gap:24px;padding-block:24px 48px}
.view>h1{font-size:26px}
.view.tight{gap:16px;padding-top:16px}
.view.snug{gap:12px;padding-top:12px}
.lead{font-size:17px}
.aside{color:var(--g700)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{display:flex;align-items:center;gap:12px;font-size:18px;color:var(--g700)}
.sec>h2::after{content:"";flex:1;border-top:2px solid var(--g200)}
.foot{position:sticky;bottom:0;z-index:4;flex:none;background:var(--white);border-top:1px solid var(--g420)}
.foot .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.foot .pair{display:flex;gap:8px}
.foot .pair .btn{flex:0 1 auto;white-space:nowrap}
.foot .pair .btn.solid,.foot .pair .wait{flex:1 1 0;white-space:normal}
.foot .pair .wait{padding:0 2px}
.wait{display:grid;place-items:center;min-height:60px;padding:0 8px;color:var(--g700);font-size:16px;line-height:1.4;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:96px;min-height:48px;max-width:100%;padding:8px 16px;border:1px solid currentColor;border-radius:8px;background:var(--white);color:var(--key-900);font-weight:700;font-size:16px;line-height:1.3;text-align:center;text-decoration:none;text-underline-offset:3px}
.btn.lg{min-height:60px;padding:12px 16px;font-size:18px}
.btn.solid{border:4px double transparent;background:var(--key-900);color:var(--white)}
.btn.text{min-width:0;border:0;background:transparent;text-decoration:underline;text-decoration-thickness:1px}
.btn.wide{width:100%}
.btn svg.i{width:22px;height:22px}
.btn.two{justify-content:flex-start;gap:12px;padding:10px 16px;text-align:left}
.btn.two b,.btn.two small{display:block}
.btn.two small{font-size:16px;font-weight:400;color:var(--g700)}
@media (hover:hover){
  .btn:hover{background:var(--key-200);color:var(--key-1000);text-decoration:underline;text-decoration-thickness:1px}
  .btn.solid:hover{background:var(--key-1000);color:var(--white)}
  .btn.text:hover{background:var(--key-50);text-decoration-thickness:3px}
}
.btn:active{background:var(--key-300);color:var(--key-1200)}
.btn.solid:active{background:var(--key-1200);color:var(--white)}
.btn.text:focus-visible{background:var(--focus)}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:3px 8px;border:1px solid var(--g700);border-radius:8px;background:var(--g50);color:var(--g800);font-size:16px;font-weight:400;line-height:1.2;white-space:nowrap}
.chip svg.i{width:20px;height:20px}
.chip.ok{border-color:var(--ok-2);background:var(--ok-bg);color:var(--ok-ink)}
.chip.low{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.chip.out{border-color:var(--err-1);background:var(--err-bg);color:var(--err-ink)}
.chip.key{border-color:var(--key-900);background:var(--key-50);color:var(--key-1000)}
.chip.plain{background:var(--white)}
.pic{position:relative;display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:12px;background:var(--sou-bg);color:var(--sou-ink)}
.pic .tg{position:absolute;right:-5px;bottom:-5px;min-width:24px;height:22px;padding:0 4px;border:1px solid var(--white);border-radius:6px;background:var(--g800);color:var(--white);font-size:16px;font-style:normal;font-weight:700;line-height:20px;letter-spacing:0;text-align:center;white-space:nowrap}
.pic svg.i{width:36px;height:36px;stroke-width:1.75}
.pic.hai{background:var(--hai-bg);color:var(--hai-ink)} .pic.eis{background:var(--eis-bg);color:var(--eis-ink)}
.pic.sho{background:var(--sho-bg);color:var(--sho-ink)} .pic.bic{background:var(--bic-bg);color:var(--bic-ink)}
.pic.key{background:var(--key-50);color:var(--key-900)} .pic.yel{background:var(--warn-bg);color:var(--warn-ink)}
.pic.sm{width:44px;height:44px;border-radius:10px} .pic.sm svg.i{width:28px;height:28px}
.pic.lg{width:72px;height:72px;border-radius:16px} .pic.lg svg.i{width:46px;height:46px}
.bigs{display:flex;flex-direction:column;gap:12px}
.big{display:grid;grid-template-columns:64px minmax(0,1fr) 24px;gap:16px;align-items:center;width:100%;min-height:104px;padding:16px;border:1px solid var(--key-900);border-radius:12px;background:var(--white);color:var(--g900);text-align:left}
.big .pic{width:64px;height:64px;border-radius:50%}
.big b{display:block;font-size:22px;line-height:1.4}
.big small{display:block;font-size:16px;line-height:1.5;color:var(--g700)}
.big .chip{margin-top:6px;font-weight:700}
.big>svg.i{color:var(--key-900)}
.big.solid{border:4px double transparent;background:var(--key-900);color:var(--white)}
.big.solid small{color:var(--white)}
.big.solid .pic{background:var(--white);color:var(--key-900)}
.big.solid .chip{border-color:var(--white);background:var(--white);color:var(--key-1000)}
.big.solid>svg.i{color:var(--white)}
@media (hover:hover){.big:hover{background:var(--key-50)}.big:hover b{text-decoration:underline;text-underline-offset:4px}.big.solid:hover{background:var(--key-1000)}}
.big:active{background:var(--key-100)} .big.solid:active{background:var(--key-1200)}
.others{border-top:1px solid var(--g420)}
.other{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 0;border:0;border-bottom:1px solid var(--g420);background:none;color:var(--g900);text-align:left}
.other b{display:block;font-size:18px;line-height:1.4}
.other .st{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--g700)}
.other>svg.i{width:20px;height:20px;color:var(--key-900)}
@media (hover:hover){.other:hover{background:var(--g50)}.other:hover b{text-decoration:underline;text-underline-offset:3px}}
.h2{font-size:18px;color:var(--g700)}
.search{display:flex;flex-direction:column;gap:8px}
.search label{font-size:17px;font-weight:700}
.field{display:block;width:100%;height:56px;padding:0 16px;border:1px solid var(--g600);border-radius:8px;background:var(--white);color:var(--g900);font-size:17px;line-height:1}
.field::placeholder{color:var(--g600)}
@media (hover:hover){.field:hover{border-color:var(--black)}}
#results{display:flex;flex-direction:column;gap:12px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:599px){.fchips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:thin}.fchip{flex:none;white-space:nowrap}}
.fwrap{position:relative}
@media (max-width:599px){.fwrap::after{content:"";position:absolute;top:0;right:-16px;bottom:6px;width:28px;background:linear-gradient(to right,rgba(255,255,255,0),var(--white));pointer-events:none}}
.fchip{min-height:48px;padding:0 14px;border:1px solid var(--g600);border-radius:24px;background:var(--white);color:var(--g800);font-size:16px}
.fchip[aria-pressed="true"]{border:2px solid var(--key-900);padding:0 13px;background:var(--key-50);color:var(--key-1000);font-weight:700}
@media (hover:hover){.fchip:hover{border-color:var(--black)}}
.prods{display:flex;flex-direction:column;gap:8px}
.prod{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 12px;align-items:center;width:100%;padding:12px;border:1px solid var(--g420);border-radius:12px;background:var(--white);color:var(--g900);text-align:left;line-height:1.5}
button.prod{grid-template-columns:28px 56px minmax(0,1fr)}
button.prod.go{grid-template-columns:56px minmax(0,1fr) 24px}
button.prod.go>svg.i{color:var(--key-900)}
.nf{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:12px;background:var(--g50)}
.nf li{padding:2px 0}
.prod b{display:block;font-size:18px}
.prod .mk{display:block;color:var(--g700)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--g700)}
.box{flex:none;display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--g600);border-radius:4px;background:var(--white);color:var(--white)}
.box svg.i{width:20px;height:20px;stroke-width:3;opacity:0}
[aria-pressed="true"]>.box{border-color:var(--key-900);background:var(--key-900)}
[aria-pressed="true"]>.box svg.i{opacity:1}
button.prod[aria-pressed="true"]{padding:11px;border:2px solid var(--key-900);background:var(--key-50)}
@media (hover:hover){button.prod:hover,.sz:hover{border-color:var(--black)}}
.sizes{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.sz{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border:1px solid var(--g420);border-radius:8px;background:var(--white);color:var(--g900);text-align:left;line-height:1.3}
.sz b{font-size:18px}
.sz small{display:block;font-size:16px;color:var(--g700)}
.sz[aria-pressed="true"]{padding:5px 9px;border:2px solid var(--key-900);background:var(--key-50)}
.prods.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.prod.slim{grid-template-columns:28px 44px minmax(0,1fr);min-height:58px;padding:6px 12px}
button.prod.slim[aria-pressed="true"]{padding:5px 11px}
.lead.near{margin-top:-8px}
.lowlist{display:flex;flex-direction:column;gap:14px}
.lowlist .sec{gap:6px}
.lowlist .prods{gap:6px}
.prod.slim b{font-size:17px}
div.prod.still{background:var(--g50);border-style:dashed;border-color:var(--g600)}
.shot{display:block;width:100%;max-height:240px;object-fit:contain;border:1px solid var(--g420);border-radius:12px;background:var(--g50)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{display:block;width:72px;height:72px;object-fit:cover;border:1px solid var(--g420);border-radius:8px;background:var(--g50)}
.seen{display:flex;align-items:center;gap:4px;color:var(--g700)}
.seen svg.i{width:20px;height:20px}
.footres{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 12px;padding:0 4px}
.footres b{font-size:24px;line-height:1.3}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.radio{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 16px 8px 12px;border:1px solid var(--g420);border-radius:8px;background:var(--white);color:var(--g800);text-align:left;line-height:1.4}
.radio[aria-checked="true"]{padding:7px 15px 7px 11px;border:2px solid var(--key-900);background:var(--key-50)}
.radio .o{flex:none;display:grid;place-items:center;width:36px;height:36px;border:3px solid var(--g600);border-radius:50%;background:var(--white)}
.radio[aria-checked="true"] .o{border-color:var(--key-900)}
.radio[aria-checked="true"] .o::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--key-900)}
.radio b{display:block;font-size:18px}
.radio small{display:block;font-size:16px;color:var(--g700)}
@media (hover:hover){.radio:hover{border-color:var(--black)}}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:28px 44px minmax(0,1fr);gap:12px;align-items:center;min-height:68px;padding:8px 16px 8px 12px;border:1px solid var(--g420);border-radius:8px;background:var(--white);color:var(--g800);text-align:left;line-height:1.4}
.check[aria-pressed="true"]{padding:7px 15px 7px 11px;border:2px solid var(--key-900);background:var(--key-50)}
.check b{display:block;font-size:18px}
.check small{display:block;font-size:16px;color:var(--g700)}
.lines{border-top:1px solid var(--g420)}
.line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--g420)}
.line .nm{font-size:18px;font-weight:700;line-height:1.4}
.line .nm small{display:block;font-size:16px;font-weight:400;color:var(--g700)}
.line .qty{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.line .qty.fix{justify-content:flex-start}
.line .ql{font-weight:700}
.line .qs{flex-basis:100%;color:var(--g700)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{display:grid;place-items:center;min-width:52px;height:52px;padding:0 4px;border:1px solid var(--key-900);border-radius:8px;background:var(--white);color:var(--key-900);font-size:16px;font-weight:700}
.stepper output{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:6em;min-height:52px;font-size:20px;font-weight:700;line-height:1.3}
.stepper output small{font-size:16px;font-weight:400;color:var(--g700)}
@media (hover:hover){.stepper button:hover{background:var(--key-200)}}
.stepper button:active{background:var(--key-300)}
.stepper.xl{align-self:center;gap:12px}
.stepper.xl button{min-width:64px;height:64px}
.stepper.xl output{min-width:5em;font-size:32px}
.price{font-size:18px;font-weight:700}
.prog{font-size:17px;font-weight:700;color:var(--g700)}
.bar .prog{margin-left:auto}
.who{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--g420);border-radius:12px}
.who b{display:block;font-size:20px;line-height:1.4}
.who small{display:block;font-size:16px;color:var(--g700)}
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;border-radius:12px;background:var(--g50)}
.hint p{font-size:16px;line-height:1.6}
.hint p.at{flex:1 1 96px;color:var(--g700)}
.hint p.at b{display:block;font-size:20px;line-height:1.4;color:var(--g900)}
.hint p.all{flex-basis:100%}
.tag{display:inline-flex;flex-direction:column;gap:0;padding:6px 14px;border:2px dashed var(--g600);border-radius:4px;background:var(--white);color:var(--g900);line-height:1.3;transform:rotate(-2deg)}
.tag small{font-size:16px;color:var(--g700)}
.tag b{font-size:22px;letter-spacing:.06em;white-space:nowrap}
.tag b .on{border-radius:3px;background:var(--key-100);box-shadow:inset 0 -3px 0 var(--key-900);color:var(--key-1000)}
.tag b .ph{font-size:16px;font-weight:400;letter-spacing:0;color:var(--g600)}
.tag b .ph.on{color:var(--key-1000)}
.photo{display:flex;flex-direction:column;gap:8px}
.dp{display:flex;align-items:stretch;gap:6px}
.slot{display:inline-flex;align-items:center;justify-content:center;gap:1px;min-width:60px;min-height:52px;padding:0 10px;border:1px solid var(--key-900);border-radius:8px;background:var(--white);color:var(--key-900);font-size:17px;white-space:nowrap}
.slot b{font-size:22px;line-height:1}
.slot.blank{border-style:dashed;border-color:var(--g600);color:var(--g700)}
.slot[aria-pressed="true"]{padding:0 9px;border:2px solid var(--key-900);background:var(--key-50);color:var(--key-1000)}
@media (hover:hover){.slot:hover{border-color:var(--black)}}
.dp .left{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;font-size:16px;font-weight:700;line-height:1.3;text-align:right;color:var(--key-1000)}
.dp .left.past{color:var(--err-ink)}
.ask{font-size:16px;line-height:1.4;color:var(--g800)}
.picks{display:grid;gap:6px}
.picks.y{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.picks.m{grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.picks.d{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:3px}
.picks button{min-height:52px;padding:0 2px;border:1px solid var(--g420);border-radius:8px;background:var(--white);color:var(--g800);font-size:18px}
.picks.m button{font-size:17px}
.picks.d button{min-height:46px;font-size:17px}
.picks button.more{grid-column:1/-1;justify-self:start;min-height:44px;padding:0 8px;border:0;background:none;font-size:16px;color:var(--key-900);text-decoration:underline;text-underline-offset:3px}
.picks button[aria-pressed="true"]{border:2px solid var(--key-900);background:var(--key-900);color:var(--white);font-weight:700}
@media (hover:hover){.picks button:not([aria-pressed="true"]):hover{border-color:var(--black);background:var(--key-50)}}
.lots{display:flex;flex-direction:column;gap:8px}
.lot{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 12px;align-items:start;padding:16px;border:1px solid var(--g420);border-radius:12px}
.lot.soon{border-color:var(--err-1)} .lot.near{border-color:var(--warn-line)}
.lot .nm{font-size:18px;font-weight:700;line-height:1.4}
.lot .first{font-weight:700;color:var(--g900)}
.lot .acts{grid-column:1/-1}
.todo{display:flex;flex-direction:column;gap:12px;padding:16px;border:2px solid var(--warn-line);border-radius:12px;background:var(--warn-bg)}
.todo h2{display:flex;align-items:center;gap:8px;font-size:18px;color:var(--warn-ink)}
.todo ul{color:var(--g900)}
.rows{border-top:1px solid var(--g420)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:12px;align-items:center;width:100%;min-height:68px;padding:8px 0;border:0;border-bottom:1px solid var(--g420);background:none;color:var(--g900);text-align:left}
.row .nm{font-size:18px;font-weight:700;line-height:1.4}
.row .nm small{display:block;font-size:16px;font-weight:400;color:var(--g700)}
.row>svg.i{width:20px;height:20px;color:var(--key-900)}
@media (hover:hover){button.row:hover{background:var(--g50)}button.row:hover .nm{text-decoration:underline;text-underline-offset:3px}}
.one{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 16px;border:1px solid var(--g420);border-radius:12px;text-align:center}
.one b{font-size:20px}
.one small{font-size:16px;color:var(--g700)}
.facts{border-top:1px solid var(--g420)}
.facts div{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--g200)}
@media (min-width:560px){.facts div{grid-template-columns:9em minmax(0,1fr)}}
.facts dt{color:var(--g700)}
.facts dd{font-weight:700;color:var(--g900)}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding:12px 16px 12px 20px;border:2px solid var(--ok-2);box-shadow:inset 8px 0 0 var(--ok-2);background:var(--white);color:var(--g900);font-size:17px;font-weight:700}
.note span{display:inline-flex;align-items:center;gap:8px;min-width:0}
.note svg.i{color:var(--ok-2)}
.note.err{border-color:var(--err-1);box-shadow:inset 8px 0 0 var(--err-1)}
.note.err svg.i{color:var(--err-1)}
.note.info{border-color:var(--g600);box-shadow:inset 8px 0 0 var(--g600)}
.note.info svg.i{color:var(--g700)}
.note.warn{border-color:var(--warn-line);box-shadow:inset 8px 0 0 var(--warn-line)}
.note.warn svg.i{color:var(--warn-ink)}
#note:empty,#err:empty,#xmsg:empty{display:none}
.empty{padding:24px 16px;border:1px dashed var(--g420);border-radius:12px;color:var(--g700);font-size:17px;text-align:center}
.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding-top:16px;border-top:1px solid var(--g200);color:var(--g700)}
.demo .link{flex-basis:100%;display:flex;align-items:center;gap:6px}
.demo .link svg.i{width:20px;height:20px;color:var(--ok-2)}

var S, SAMPLE=null, CAN_PHOTO=false, IMG_MAX=4, MAX_SHOTS=12, SCAN_T=0;
var SAMPLE_IDS=['pants-m','pants-l','pad-d','pad-n','wipe','glove-n-m','mask','hand','toromi','drink','ptowel','tp'];
function init(kind){
  S={view:'home',q:'',cat:null,reg:{},oq:{},sel:{},keep:null,ord:{},cart:{},how:'haitatsu',note:null,err:null,flow:null,x:null,edit:null,seq:1,
     orders:[],lots:[],lk:1,need:[],nk:1,addFrom:null,regN:0,scan:null};
  CAT.forEach(function(x){S.oq[x.id]=x.oq;S.ord[x.id]=null});
  if(kind==='empty')return;
  SAMPLE_IDS.forEach(function(id){S.reg[id]=true});
  var d=day(38), a=new Date(Y0,TODAY.getMonth()+7,1), b=new Date(Y0,TODAY.getMonth()+20,1);
  addLot('drink',null,{y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()});
  addLot('toromi',null,{y:a.getFullYear(),m:a.getMonth()+1,d:null});
  addLot('hand',null,{y:b.getFullYear(),m:b.getMonth()+1,d:null});
}
var KEY='zaiko-demo-v4';
function pack(){var reg={}, cart={};CAT.forEach(function(x){if(S.reg[x.id])reg[x.id]=true;if(S.cart[x.id]>0)cart[x.id]=S.cart[x.id]});
  return JSON.stringify({reg:reg,oq:S.oq,ord:S.ord,cart:cart,how:S.how,seq:S.seq,lk:S.lk,nk:S.nk,lots:S.lots,need:S.need,
    orders:S.orders.map(function(o){return {id:o.id,eta:+o.eta,how:o.how,lines:o.lines}})})}
function save(){var s=pack();try{localStorage.setItem(KEY,s)}catch(e){}push(s)}
function unpack(j){
  if(!j||!j.reg)return false;
  var ok=function(id){return !!BY[id]};
  S.reg={};S.cart={};
  Object.keys(j.reg).forEach(function(id){if(ok(id)&&j.reg[id])S.reg[id]=true});
  CAT.forEach(function(x){var id=x.id;S.oq[id]=j.oq&&j.oq[id]>0?j.oq[id]:x.oq;S.ord[id]=j.ord&&(j.ord[id]==='cart'||j.ord[id]==='ordered')?j.ord[id]:null;if(j.cart&&j.cart[id]>0&&S.ord[id]==='cart')S.cart[id]=j.cart[id]});
  S.how=j.how==='mise'?'mise':'haitatsu';S.seq=j.seq||1;S.lk=j.lk||1;S.nk=j.nk||1;
  S.lots=(j.lots||[]).filter(function(l){return ok(l.id)&&l.d8&&l.d8.y&&l.d8.m});
  S.need=(j.need||[]).filter(function(n){return ok(n.id)});
  S.orders=(j.orders||[]).map(function(o){return {id:o.id,eta:new Date(o.eta),how:o.how,lines:(o.lines||[]).filter(function(l){return ok(l.id)})}}).filter(function(o){return o.lines.length});
  CAT.forEach(function(x){var id=x.id;if(S.ord[id]==='ordered'&&!orderOf(id))S.ord[id]=null;if(S.ord[id]==='cart'&&!S.cart[id])S.ord[id]=null});
  return true}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'null');if(!j||!j.reg)return false;init('empty');return unpack(j)}catch(e){return false}}
var DOC=null, SHARED=false, REMOTE=null, TOUCHED=false, SENDING=false, ME='t'+Math.random().toString(36).slice(2,10);
function push(s){
  if(!SHARED||!TOUCHED||SENDING||s===REMOTE)return;
  SENDING=true;
  var w;try{w=DOC.set({v:1,by:ME,at:Date.now(),s:s})}catch(e){SENDING=false;SHARED=false;return}
  w.then(function(){REMOTE=s},function(e){
    var c=e&&e.code;if(c==='invalid_argument'||c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){SHARED=false;if(S.view==='home')render()}
  }).then(function(){SENDING=false;var now=pack();if(now!==s)push(now)});
}
function fixView(){
  var v=S.view;
  if(v==='expq'){var X=S.x, i0=X?X.i:0;
    while(X&&X.i<X.keys.length&&!needOf(X.keys[X.i]))X.i++;
    if(!X||X.i>=X.keys.length){S.x=null;S.view='home';S.note=null;return true}
    if(X.i!==i0){X.y=X.m=X.d=null;X.at='y';X.wide=false;X.msg=null;X.busy=false;return true}
    return false}
  if(v==='recv'){var F=S.flow, keys={}, same=!!F;
    S.orders.forEach(function(o){o.lines.forEach(function(l){var k=o.id+'_'+l.id;keys[k]=1;if(F&&!(k in F.got))same=false})});
    if(F)Object.keys(F.got).forEach(function(k){if(!keys[k])same=false});
    if(!same){if(S.orders.length)startRecv();else S.flow=null}
    return true}
  if(v==='edit'&&!S.reg[S.edit])S.view='items';
  return v!=='find'&&v!=='scan';
}
function onRemote(snap){
  if(!snap||(snap.metadata&&snap.metadata.hasPendingWrites))return;
  var first=!SHARED, d=snap.exists?snap.data():null, s=d&&typeof d.s==='string'?d.s:null, j;
  SHARED=true;
  if(!s||s===REMOTE){if(first&&S.view==='home')render();return}
  REMOTE=s;
  if(d.by===ME||s===pack()){if(first&&S.view==='home')render();return}
  try{j=JSON.parse(s)}catch(e){return}
  var c0=cartIds().length, w0=waitN();
  if(!unpack(j))return;
  TOUCHED=false;
  if(S.note&&S.note.undo)S.note=null;
  var draw=fixView(), c1=cartIds().length, w1=waitN();
  if(!first&&(S.view==='home'||S.view==='order'))S.note={t:c1>c0?'ほかの端末で、注文かごに '+(c1-c0)+'種類 入りました。':w1>w0?'ほかの端末で、注文されました。':'ほかの端末で変わった所を、反映しました。'};
  if(draw)render();else try{localStorage.setItem(KEY,pack())}catch(e){}
}
var qtxt=function(x,q){return x.os>1?q+x.ou+'（'+(q*x.os)+x.u+'）':q+x.u};
var regs=function(){return CAT.filter(function(x){return S.reg[x.id]})};
var cartIds=function(){return CAT.filter(function(x){return S.ord[x.id]==='cart'}).map(function(x){return x.id})};
var selIds=function(){return CAT.filter(function(x){return S.sel[x.id]}).map(function(x){return x.id})};
var waitN=function(){return S.orders.reduce(function(a,o){return a+o.lines.length},0)};
var firstOrder=function(){return S.orders.slice().sort(function(a,b){return a.eta-b.eta})[0]};
var orderOf=function(id){return S.orders.filter(function(o){return o.lines.some(function(l){return l.id===id})})[0]};
var nearLots=function(){return S.lots.filter(function(l){return leftDays(l.d8)<=45})};
var etaTxt=function(d){var r=rel(d);return (r?r+' ':'')+md(d)};
var etaWord=function(o){return o.how==='mise'?'店で受け取る':(rel(o.eta)||md(o.eta))+'届く'};
function btn(label,act,kind,k){return '<button type="button" class="btn '+(kind||'')+'" data-act="'+act+'" data-k="'+(k||act)+'">'+label+'</button>'}
function tagOf(x){return x.size&&x.size.length<=3?x.size:/昼用/.test(x.n)?'昼':/夜用/.test(x.n)?'夜':''}
function pic(x,size,plain){var t=plain?'':tagOf(x);return '<span class="pic '+x.c+(size?' '+size:'')+'">'+ic(x.ic)+(t?'<i class="tg num" aria-hidden="true">'+esc(t)+'</i>':'')+'</span>'}
function tail(t){return /</.test(t)?t:t.replace(/、([^、]+)$/,'、<span class="nb">$1</span>')}
function h1(t){return '<h1 id="h" tabindex="-1">'+tail(t)+'</h1>'}

  var n=S.note, h='<div id="note" aria-live="polite">';
  if(n)h+='<p class="note"><span>'+ic('check')+esc(n.t)+'</span>'+(n.undo?btn(n.ul||'取り消す','undo','text'):'')+'</p>';
  return h+'</div>';
}

function stepper(act,label,out,xl){return '<span class="stepper'+(xl?' xl':'')+'"><button type="button" data-act="'+act+':-1" data-k="'+act+':-1" aria-label="'+label+'を1つ減らす">'+ic('minus')+'</button><output class="num">'+out+'</output><button type="button" data-act="'+act+':1" data-k="'+act+':1" aria-label="'+label+'を1つ増やす">'+ic('plus')+'</button></span>'}

function wait(t){return '<p class="wait"><span>'+tail(t)+'</span></p>'}
var boxHtml='<span class="box">'+ic('check')+'</span>';
function found(){
  var q=norm(S.q), list=CAT.filter(function(x){return !S.reg[x.id]}), title, fz=q&&S.fz&&S.fz.q===S.q?S.fz:null;
  if(fz){var ids=fz.ids;list=list.filter(function(x){return ids.indexOf(x.id)>=0}).sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id)});title='「'+esc(S.q.trim())+'」に近い商品'}
  else if(q){var ts=S.q.split(/[\s\u3000]+/).map(norm).filter(Boolean);list=list.filter(function(x){return ts.every(function(t){return x.key.indexOf(t)>=0})});title='「'+esc(S.q.trim())+'」で見つかった商品'}
  else if(S.cat){list=list.filter(function(x){return x.cat===S.cat});title=CATN[S.cat]}
  else{list=list.filter(function(x){return x.pop<99}).sort(function(a,b){return a.pop-b.pop});title='よく買われている商品'}
  var fams=[], seen={};
  list.forEach(function(x){if(!seen[x.fam]){seen[x.fam]=[];fams.push(seen[x.fam])}seen[x.fam].push(x)});
  return {title:title,fams:fams,n:list.length,fz:!!fz};
}
function prodRow(f){
  var x=f[0], ex=x.exp?'<span class="chip plain">'+ic('clock')+'期限あり</span>':'';
  if(f.length===1&&!x.size)return '<button type="button" class="prod" aria-pressed="'+(!!S.sel[x.id])+'" data-act="pick:'+x.id+'" data-k="pick:'+x.id+'">'+boxHtml+pic(x)+'<span><b>'+esc(x.n)+'</b><span class="mk">'+esc(x.mk)+'・<span class="nb">'+pkt(x)+'</span>'+'</span><span class="meta"><span class="num">'+priceTxt(x)+'</span>'+ex+'</span></span></button>';
  var same=f.every(function(v){return v.pr===x.pr});
  return '<div class="prod">'+pic(x,'',true)+'<div><b>'+esc(x.n)+'</b><span class="mk">'+esc(x.mk)+'</span><span class="meta"><span class="num">'+(same?priceTxt(x):'サイズで値段が変わります')+'</span>'+ex+'</span></div><div class="sizes" role="group" aria-label="'+esc(x.n)+'のサイズ">'+f.map(function(v){
    return '<button type="button" class="sz" aria-pressed="'+(!!S.sel[v.id])+'" data-act="pick:'+v.id+'" data-k="pick:'+v.id+'">'+boxHtml+'<span><b>'+esc(v.size)+'</b><small class="num">'+esc(v.pk)+(same?'':'・'+yen(v.pr))+'</small></span></button>'}).join('')+'</div></div>';
}
function resultsHtml(){
  var r=found(), none;
  if(r.fz)none='近い商品も、見つかりませんでした。言葉を変えるか、上の種類から選んでください。';
  else if(S.q&&CAN_PHOTO)none='見つかりませんでした。'+(S.fzBusy?'<br>近い商品を、探しています…':'<br>'+btn('近い商品を探す','fuzzy',''));
  else none='見つかりませんでした。言葉を変えるか、上の種類から選んでください。';
  return '<div class="fwrap"><div class="fchips" role="group" aria-label="種類でしぼる">'+[[null,'よく買われている商品']].concat(CATS).map(function(c){
      return '<button type="button" class="fchip" aria-pressed="'+(!S.q&&S.cat===c[0])+'" data-act="cat:'+(c[0]||'')+'" data-k="cat:'+(c[0]||'')+'">'+c[1]+'</button>'}).join('')+'</div></div>'+
    '<section class="sec"><h2 id="rt" aria-live="polite"'+(S.q?'':' class="vh"')+'>'+r.title+'</h2>'+(r.fams.length?'<div class="prods">'+r.fams.map(prodRow).join('')+'</div>':'<div class="empty">'+none+'</div>')+'</section>';
}

      X.msg={ok:1,t:'写真から「'+ymdTxt({y:X.y,m:X.m,d:X.d})+'」と読みました。箱と見くらべて、合っていれば登録してください。'+(x.exp.f==='ymd'&&!X.d?'日は読めなかったので、下で選んでください。':'')}}
    else X.msg={t:'写真から読み取れませんでした。下で選んでください。'};
  }).catch(function(e){
    if(S.x!==X||X.keys[X.i]!==token)return;
    var c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='images_unavailable'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')CAN_PHOTO=false;
    X.msg={t:c==='rate_limited'?'いまは写真を読めません。少し待つか、下で選んでください。':c==='image_rejected'?'この写真は読めませんでした。撮り直すか、下で選んでください。':'写真から読み取れませんでした。下で選んでください。'};
  }).then(function(){if(S.x===X&&X.keys[X.i]===token){X.busy=false;render()}});
});
$('#shots').addEventListener('change',function(){
  var fs=[].slice.call(this.files||[]);if(!fs.length||!SAMPLE)return;
  if(S.view!=='find'&&S.view!=='scan')return;
  startScan(fs,S.view==='scan'&&S.scan&&S.scan.phase==='sum'?S.scan:null);
});
if(!load())init();
render();
})();
</script>
