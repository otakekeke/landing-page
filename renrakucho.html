function splitSaid(text){

  const toOf = u => u.parts && u.parts.length===1 ? u.parts[0].to : null;
  const isInstr = u => KW_STAFF.test(u.s) && instrOnly(u.s);

    for(let j=i-1;j>=0;j--){
      const v = units[j];
      if(sameFinal && v.fi!==units[i].fi) return false;
      if(v.drop || isInstr(v) || !hasContent(v.s)) continue;
      if(toOf(v)==='H') return true;
      if(toOf(v)==='R'){ if(hasFields(v.s)) return false; v.parts = [{to:'H', text:v.s}]; return true; }
      return false;
    }
    return false;

  for(let i=0;i<units.length;i++){
    const u = units[i], pv = units[i-1], nx = units[i+1];
    const firstInFinal = !pv || pv.fi!==u.fi, lastInFinal = !nx || nx.fi!==u.fi;
    const tail = (lastInFinal && !firstInFinal) || (firstInFinal && lastInFinal && !nx);
    const tgt = () => u.fi<=scopeTill ? 'H' : cur;
    const toH = () => { if(pv && toOf(pv)==='R' && !hasFields(pv.s)) pv.parts = [{to:'H', text:pv.s}]; };

      if(!instrOnly(u.s)){ u.parts = [{to:'H', text:u.s}]; continue; }

      const c = cutLoop(u.s, cur); u.parts = c.parts.map(p=>({to: p.to==='R' && u.fi<=scopeTill ? 'H' : p.to, text:p.text})); cur = c.cur; continue;
    }

  }

}

const HAND_FIX_WORDS = /(?:直して|なおして|変えて|かえて|消して|けして|いらない|取って|とって|削って|じゃなくて|じゃなく|ではなくて|ではなく|でなくて|違う|ちがう|間違|まちが)/;
const FIX_TO = /(?:に|へ)[\s、,]*(?:直して|なおして|変えて|かえて)(?:ください|下さい|くれる|ね|ちょうだい|おいて)?[\s。！!？?]*$/;
const FIX_DEL = /(?:を|は)[\s、,]*(?:消して|けして|取って|削って)(?:ください|下さい|くれる|ね|ちょうだい|おいて)?[\s。！!？?]*$/;
const SORRY_ONLY = /^[\s、,]*(?:あっ?|ああ|えっと|えーと)?[\s、,]*(?:ごめん(?:なさい)?|すみません|違う|ちがう|違った|ちがった|間違えた|まちがえた|間違い|まちがい)?[\s、,。！!]*$/;
function isFixCmd(x, ctx){
  const t = norm(String(x||''));
  if(!FIX_TO.test(t) && !FIX_DEL.test(t)) return false;
  const m = t.replace(/^[\s、,]*(?:あっ?|ああ|えっと|ごめん(?:なさい)?|すみません|違う|ちがう|間違えた|まちがえた)?[\s、,]*/, '').match(/^「?(.+?)」?[\s、,]*(?:を|は)/);
  const a = m ? m[1].replace(/[「」『』\s、,]/g,'') : '';
  return !!a && norm(String(ctx||'')).replace(/[\s、,]/g,'').includes(a.slice(-6));
}
function splitFixCmd(text, before){
  const ss = String(text||'').split(/(?<=[。！？!?])|\n+/).map(x=>x.trim()).filter(Boolean);
  const body = [], fix = [];
  ss.forEach((x,i)=>{
    const ctx = [before||''].concat(body).join(' ');
    if(isFixCmd(x, ctx)) fix.push(x);
    else if(SORRY_ONLY.test(x) && ss[i+1] && isFixCmd(ss[i+1], ctx)) {}
    else body.push(x);
  });
  return {body: joinRaw(body), fix};
}

  const t = norm(String(text||''));

  s.raw.push({at:Date.now(), text});

  ui.busy = null;

  if(t) s.text = t;
  if(named) s.about = named; else if(!s.about && out.about) s.about = out.about;
  ui.notice = s.text!==before ? {text:'話した事を、いまの申し送りに入れました'} : {kind:'warn', text:'いまの申し送りは変わりませんでした。直す時は「〇〇を△△に変えて」のように話します'};
  fallbackNotice(out.why); render();
}
async function doFixHand(text, named){
  const s = ui.sheet; if(!s || ui.busy) return;
  const said = withAnswer(s.fixes, text);
  const fx = {at:Date.now(), text}; s.fixes.push(fx);
  ui.busy = 'fix'; render();
  const cur = Object.assign(recOf(blank()), {hand:s.text});
  const out = await fixFrom(null, cur, said, rawText(s.raw, s.fixes));
  fx.asked = !!out.ask; fx.said = out.ask || out.said;
  ui.busy = null;
  if(ui.sheet!==s){ render(); return; }
  if(out.changed.includes('hand')) s.text = addDates(out.r.hand || '');
  else if(out.changed.includes('note') && out.r.note){ s.text = s.text + out.r.note; out.said = '申し送りに足しました'; }
  if(named) s.about = named;
  ui.notice = out.ask ? {kind:'warn', text:out.ask} : {text: out.said};
  fallbackNotice(out.why); render();
}
function toastHtml(){
  if(!ui.toast) return '';
  return `<div class="toast" role="status"><p class="tn-cap">${ic('bell')}申し送りを、職員のスマホに知らせました</p>
    <div class="tn-card"><span class="tn-ic">${ic('book')}</span><div><div class="tn-app"><span>職員の申し送り</span><span>いま</span></div><p data-toast-text>新しい申し送りがあります</p></div></div>
    <div class="tn-foot"><span>ご家族には届きません。名前や中身は、知らせに書きません</span><button class="xbtn" type="button" data-act="toast-close">${ic('x')}閉じる</button></div></div>`;
}
function showToast(){ ui.toast = {id: Date.now()}; }

function printPapers(ids){
  if(inFrame){ ui.notice = {kind:'warn', text:'この置き場所では、印刷の画面が開きません。タブレットのブラウザで開くと、そのまま印刷できます。'}; render(); return; }
  const host = $('#print');
  host.innerHTML = ids.map(id=>paperHtml(byId(id), st.records[id])).join('');
  ids.forEach(id=>{ st.records[id].printed = true; }); save();
  const done = ()=>{ window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  ui.notice = {text: ids.length>1 ? `${ids.length}人分の連絡帳の、印刷の画面を開きました。一覧に「印刷した」の印が付きます` : '連絡帳の、印刷の画面を開きました。一覧に「印刷した」の印が付きます'};
  setTimeout(()=>{ try{ window.print(); }catch(_){ } render(); }, 60);
}

function keepDraft(){
  if(ui.view!=='record' || !ui.draft || !ui.who) return;
  const dr = ui.draft;
  const m = byId(ui.who);
  if(m && dr.touched && (dr.rawR.length || dr.rawH.length || dr.made)){ ui.drafts[ui.who] = dr; ui.notice = {text:`${surname(m)}さんの書きかけは、保存せずに残してあります。「記録と連絡帳」で名前を押すと、続きから書けます`}; }
}
const ME_TTL = 30*60*1000;
function openWithMe(id){
  if(!ui.meOk || Date.now() - ui.meOk > ME_TTL){ ui.sheet = {kind:'me', top:true, then:id}; return false; }
  openRecord(id); return true;
}
function goThen(id){ if(id){ openRecord(id); window.scrollTo(0,0); } }
function openRecord(id){
  ui.who = id; ui.justSaved = false; ui.backAsk = false;
  const saved = st.records[id];
  const kept = ui.drafts[id];
  ui.draft = kept ? kept : saved ? JSON.parse(JSON.stringify(saved)) : Object.assign(blank(), {rawR:[], rawH:[], fixes:[], mode:'split', made:false, unsure:[], by:ME()});
  if(!ui.draft.rawR) ui.draft.rawR = []; if(!ui.draft.rawH) ui.draft.rawH = []; if(!ui.draft.fixes) ui.draft.fixes = [];
  ui.view = 'record';
}
function readFields(){
  if(!ui.sheet) return;
  document.querySelectorAll('#sheet [data-field]').forEach(el=>{ if(ui.sheet.kind==='hand') ui.sheet.text = el.value; else ui.sheet.v[el.dataset.field] = el.value; });
}
function openEdit(f){
  const r = ui.draft; const v = {};
  if(f==='t') v.t = r.t!=null ? r.t : 36.5;
  if(f==='p') v.p = r.p!=null ? r.p : 70;
  if(f==='o') v.o = r.o!=null ? r.o : 97;
  if(f==='bp'){ v.s = r.bp ? r.bp.s : 130; v.d = r.bp ? r.bp.d : 80; }
  if(f==='water') v.w = r.water && r.water.total!=null ? r.water.total : 200;
  if(f==='meal'){ const m = r.meal||{}; v.main = m.main; v.side = m.side; v.snack = m.snack; }
  if(f==='toilet'){ const t = r.toilet||{}; v.bm = typeof t.bm==='number' ? (t.bm>0?'あり':'なし') : t.bm; v.ur = typeof t.ur==='number' ? t.ur : (t.ur==='あり'?1:(t.ur==='なし'?0:null)); }
  if(f==='bath'){ v.done = r.bath ? r.bath.done : null; v.kind = r.bath && r.bath.done ? (r.bath.kind||'') : ''; }
  if(f==='note') v.note = r.note;
  if(f==='hand') v.hand = r.hand;
  ui.sheet = {kind:'edit', f, v, top:true, typing:false};
}
const NUM_NAME = {t:'体温', p:'脈', o:'酸素', s:'血圧の上', d:'血圧の下', w:'水分', ur:'お小水の回数'};
function numOf(name, x){
  if(x==null) return null;
  if(typeof x==='number') return x;
  const s = String(x).replace(/[０-９．]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[、，,]/g,'.').replace(/[^\d.]/g,'');
  if(!s) return null;
  const n = Number(s); const [,min,max] = STEP[name];
  if(!Number.isFinite(n) || n<min || n>max) return NaN;
  return name==='t' ? Math.round(n*10)/10 : Math.round(n);
}
function decide(){
  const s = ui.sheet; const r = ui.draft; const v = s.v;
  const names = {t:['t'], p:['p'], o:['o'], bp:['s','d'], water:['w'], toilet:['ur']}[s.f] || [];
  for(const k of names){ const n = numOf(k, v[k]); if(Number.isNaN(n)){ const [,min,max] = STEP[k]; s.err = `${NUM_NAME[k]}は、${min}から${max}までの数で入れてください`; return false; } v[k] = n; }
  if(s.f==='bp' && (v.s==null) !== (v.d==null)){ s.err = '血圧は、上と下の両方を入れてください'; return false; }
  s.err = '';
  switch(s.f){
    case 't': r.t = v.t; break;
    case 'p': r.p = v.p; break;
    case 'o': r.o = v.o; break;
    case 'bp': r.bp = v.s==null ? null : {s:v.s, d:v.d}; break;
    case 'water': r.water = v.w==null ? null : {items: r.water && r.water.items ? r.water.items.map(x=>({n:x.n, ml:r.water.items.length===1 ? v.w : x.ml})) : [], total:v.w}; break;
    case 'meal': { const m = {}; ['main','side','snack'].forEach(k=>{ if(v[k]!=null) m[k] = v[k]; }); r.meal = Object.keys(m).length ? m : null; break; }
    case 'toilet': { const t = {}; if(v.bm) t.bm = v.bm; if(v.ur!=null) t.ur = v.ur; r.toilet = Object.keys(t).length ? t : null; break; }
    case 'bath': r.bath = v.done==null ? null : {done:v.done, kind: v.done ? (v.kind||'') : ''}; break;
    case 'note': r.note = String(v.note||'').trim(); break;
    case 'hand': r.hand = String(v.hand||'').trim(); break;
  }
  r.unsure = (r.unsure||[]).filter(k=>k!==s.f);
  r.touched = true; ui.flash = [s.f]; ui.sheet = null;
  return true;
}
function clearField(){ const f = ui.sheet.f; const r = ui.draft; if(f==='note'||f==='hand') r[f] = ''; else r[f] = null; r.unsure = (r.unsure||[]).filter(k=>k!==f); r.touched = true; ui.sheet = null; }
const STEP = {t:[0.1,34,42], p:[1,30,200], o:[1,70,100], s:[1,60,260], d:[1,30,160], w:[50,0,3000], ur:[1,0,20]};
function doStep(name, dir){
  const v = ui.sheet.v; const [step,min,max] = STEP[name];
  let x = numOf(name, v[name]); if(x==null || Number.isNaN(x)) x = name==='ur' ? 0 : min;
  ui.sheet.err = '';
  x = Math.min(max, Math.max(min, Math.round((x + dir*step)*10)/10));
  v[name] = x;
}
function saveRecord(){
  const m = byId(ui.who); const dr = ui.draft;
  const prev = st.records[m.id];
  const rec = {t:dr.t, bp:dr.bp, p:dr.p, o:dr.o, water:dr.water, meal:dr.meal, toilet:dr.toilet, bath:dr.bath, note:dr.note, hand:dr.hand,
    rawR:dr.rawR, rawH:dr.rawH, fixes:dr.fixes||[], mode:'split', made:true, madeBy:dr.madeBy||'rules', unsure:dr.unsure||[], handAbout:dr.handAbout||null, by:ME(), at:Date.now(), printed:false};
  rec.log = prev ? histOf(prev).concat([{at:rec.at, by:rec.by, kind:'直した', ch:changedKeys(prev, rec)}]) : [{at:rec.at, by:rec.by, kind:'書いた', ch:[]}];
  st.records[m.id] = rec;
  delete ui.drafts[m.id]; ui.meOk = Date.now();
  let fresh = false;
  const about = dr.handAbout===null ? '' : (validId(dr.handAbout) || m.id);
  if(dr.hand){
    const h = st.hands.find(x=>x.fromRec===m.id);
    if(h){ if(h.text!==dr.hand || h.about!==about){ h.text = dr.hand; h.about = about; h.at = Date.now(); h.reads = [ME()]; if(h.by!==ME()) h.editBy = ME(); fresh = true; } }
    else { st.hands.push({id:'h'+(st.seq++), at:Date.now(), by:ME(), about, text:dr.hand, reads:[ME()], fromRec:m.id}); fresh = true; }
  }else if(prev && prev.hand){ st.hands = st.hands.filter(x=>x.fromRec!==m.id); }
  save();
  ui.view = 'paper'; ui.justSaved = fresh ? 'hand' : true; ui.draft = null;
}

function act(el){
  const d = el.dataset;
  if(d.view){ if(ui.listening) stopAll(); ui.notice = null; keepDraft(); ui.view = d.view; ui.sheet = null; ui.busy = null; render(); window.scrollTo(0,0); return; }
  if(d.hf){ ui.hf = d.hf; render(); return; }
  if(d.choice!==undefined){ doPeople(`「${d.choice}」にします`); return; }
  if(d.step){ doStep(d.step, Number(d.d)); renderSheet(); return; }
  if(d.meal){ const [k,q] = d.meal.split(':'); ui.sheet.v[k] = ui.sheet.v[k]===Number(q) && k==='snack' ? null : Number(q); renderSheet(); return; }
  if(d.bm){ ui.sheet.v.bm = d.bm; renderSheet(); return; }
  if(d.bath){ const v = ui.sheet.v; v.done = d.bath!=='0'; v.kind = d.bath==='w' ? '清拭' : d.bath==='1' && v.kind!=='清拭' ? (v.kind||'') : ''; renderSheet(); return; }
  if(d.about!==undefined){ ui.sheet.about = d.about; renderSheet(); return; }
  switch(d.act){
    case 'open': { const id = d.id; if(st.records[id] && !ui.drafts[id]){ ui.who = id; ui.view = 'paper'; ui.justSaved = false; } else openWithMe(id); render(); window.scrollTo(0,0); break; }
    case 'back': if(ui.listening) stopAll(); keepDraft(); ui.view = 'list'; ui.draft = null; ui.justSaved = false; ui.busy = null; render(); window.scrollTo(0,0); break;
    case 'mic': if(ui.listening) stopListening(); else startListening(d.t); break;
    case 'try': simulate(d.t); break;
    case 'make': doMake(); break;
    case 'raw-del': { const a = ui.draft[d.k]; a.splice(Number(d.i),1); render(); break; }
    case 'unmake-ask': ui.backAsk = true; render(); { const f = document.querySelector('.rawfold'); if(f) f.open = true; } break;
    case 'unmake-cancel': ui.backAsk = false; render(); { const f = document.querySelector('.rawfold'); if(f) f.open = true; } break;
    case 'unmake': { const dr = ui.draft; FK.forEach(k=>{ dr[k] = k==='note'||k==='hand' ? '' : null; }); dr.made = false; dr.fixes = []; dr.unsure = []; ui.backAsk = false; render(); window.scrollTo(0,0); break; }
    case 'edit': openEdit(d.f); renderSheet(); break;
    case 'typing': ui.sheet.typing = true; renderSheet(); { const t = document.querySelector('#sheet textarea'); if(t){ t.focus(); try{ t.setSelectionRange(t.value.length, t.value.length); }catch(_){} } } break;
    case 'talkfix': ui.sheet = null; window.scrollTo(0,0); startListening('rec'); break;
    case 'me': ui.sheet = {kind:'me', top:true}; render(); break;
    case 'me-pick': setMe(d.id); break;
    case 'decide': if(decide()) render(); else renderSheet(); break;
    case 'clear': clearField(); render(); break;
    case 'close': case 'close-bg': if(ui.listening) stopAll(); ui.sheet = null; ui.busy = null; render(); break;
    case 'save': saveRecord(); render(); window.scrollTo(0,0); break;
    case 'redo': openWithMe(ui.who); render(); window.scrollTo(0,0); break;
    case 'next': { const n = nextUnsaved(ui.who); if(n){ openWithMe(n); } else { ui.view = 'list'; } render(); window.scrollTo(0,0); break; }
    case 'me-go': { const then = ui.sheet && ui.sheet.then; ui.meOk = Date.now(); ui.sheet = null; goThen(then); render(); break; }
    case 'print': printPapers([ui.who]); break;
    case 'print-all': printPapers(todays().filter(m=>st.records[m.id]).map(m=>m.id)); break;
    case 'read': { const h = st.hands.find(x=>x.id===d.id); const i = h.reads.indexOf(ME()); i<0 ? h.reads.push(ME()) : h.reads.splice(i,1); save(); render(); break; }
    case 'hand-new': ui.sheet = {kind:'hand', raw:[], fixes:[], text:'', about:'', made:false, typing:false, top:true}; render(); break;
    case 'hraw-del': ui.sheet.raw.splice(Number(d.i),1); render(); break;
    case 'hand-make': doMakeHand(); break;
    case 'hand-send': {
      const s = ui.sheet; const text = String(s.text||'').trim(); if(!text) break;
      st.hands.push({id:'h'+(st.seq++), at:Date.now(), by:ME(), about:s.about||'', text, reads:[ME()], raw:s.raw, fixes:s.fixes}); save();
      ui.sheet = null; ui.hf = 'すべて'; ui.notice = {text:'申し送りました'}; showToast(); render(); break;
    }
    case 'person': { const m = byId(d.id); const c = ui.pchat; c.draft = {id:m.id, name:m.name, kana:m.kana, days:m.days.slice(), remove:false}; c.choices = null; c.action = 'ask';
      c.log.push({who:'sys', text:`${m.name}さんの、何を直しますか。例：「曜日を火曜と金曜に変えて」`}); render(); break; }
    case 'p-save': commitDraft(); break;
    case 'p-cancel': { const c = ui.pchat; c.draft = null; c.choices = null; c.action = null; c.log.push({who:'sys', text:'やめました。'}); render(); break; }
    case 'toast-close': ui.toast = null; render(); break;
    case 'notice-close': ui.notice = null; render(); break;
    case 'about': { const p = $('#about'); p.hidden = !p.hidden; el.setAttribute('aria-expanded', String(!p.hidden)); resetIdle(); break; }
    case 'reset-ask': $('#resetarea').innerHTML = `<p>入れた内容が消えて、最初の状態に戻ります。</p><div class="row" style="margin-top:8px"><button class="btn" type="button" data-act="reset-cancel">やめる</button><button class="btn solid" type="button" data-act="reset">戻す</button></div>`; break;
    case 'reset-cancel': resetIdle(); break;
    case 'reset': st = seed(TODAY); save(); ui.view = 'list'; ui.draft = null; ui.sheet = null; ui.pchat = {log:[], draft:null, choices:null, action:null}; $('#about').hidden = true; ui.notice = {text:'最初の状態に戻しました'}; render(); break;
  }
}
function stopAll(){ clearInterval(voice.timer); voice.sim = false; ui.listening = false; try{ if(voice.rec) voice.rec.abort(); }catch(_){ } try{ if(voice.dict && voice.dict.active()) voice.dict.stop(); }catch(_){ } }
function resetIdle(){ $('#resetarea').innerHTML = `<button class="btn" type="button" data-act="reset-ask">${ic('reset')}最初の状態に戻す</button>`; }
function refocus(fk){ if(!fk) return; const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if(el && document.activeElement!==el) el.focus({preventScroll:true}); }

document.addEventListener('click', e=>{
  if(e.target.closest('summary')) return;
  const el = e.target.closest('button,[data-act="close-bg"]');
  if(!el){ if(!e.target.closest('#about')){ $('#about').hidden = true; } return; }
  if(el.dataset.act==='close-bg' && e.target!==el) return;
  if(!e.target.closest('#about') && el.dataset.act!=='about'){ $('#about').hidden = true; document.querySelector('[data-act="about"]').setAttribute('aria-expanded','false'); }
  readFields();
  if(!el.closest('#about') && !['notice-close','toast-close'].includes(el.dataset.act) && el.dataset.act!=='mic') ui.notice = null;
  if(!el.closest('#about') && !el.closest('.toast') && el.dataset.act!=='about') ui.toast = null;
  const fk = el.dataset.fk;
  act(el);
  refocus(fk);
});
let numJust = null;
const selNum = t => { try{ t.setSelectionRange(0, t.value.length); }catch(_){} };
document.addEventListener('focusin', e=>{ const t = e.target; if(t && t.matches && t.matches('#sheet input.num')){ numJust = t; selNum(t); setTimeout(()=>{ if(document.activeElement===t) selNum(t); }, 0); } });
document.addEventListener('mouseup', e=>{ const t = numJust; numJust = null; if(t && e.target===t){ e.preventDefault(); selNum(t); } }, true);
document.addEventListener('input', e=>{ if(ui.sheet && e.target.closest('#sheet') && e.target.dataset.field){ if(ui.sheet.kind==='hand') ui.sheet.text = e.target.value; else ui.sheet.v[e.target.dataset.field] = e.target.value; } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && ui.sheet){ if(ui.listening) stopAll(); ui.sheet = null; ui.busy = null; render(); return; }
  if(e.key==='Enter' && !e.isComposing && ui.sheet && ui.sheet.kind==='edit' && e.target.matches && e.target.matches('#sheet .stepper input')){ e.preventDefault(); readFields(); if(decide()) render(); else { renderSheet(); refocus('in-' + e.target.dataset.field); } }
});

window.__renrakucho = { parse, splitSaid, splitFixCmd, stripEnd, saidEnd, famBath, keepStaffOut: r => keepStaffOut(Object.assign(blank(), r)), numOf, fixNames, fixRules, peopleRules, addedWords, addDates, flatSaid, addMe, applyChoice, makeRules: (id, raw) => makeRules(byId(id), raw),
  prompts: { make: o => promptMake(Object.assign({}, o, {person: o.person ? byId(o.person) : null})), fix: o => promptFix(Object.assign({}, o, {person: o.person ? byId(o.person) : null})), people: promptPeople },
  normRec, normDraft, say: (text, target) => simulate(target || (ui.view==='people' ? 'people' : ui.sheet && ui.sheet.kind==='hand' ? 'hand' : 'rec'), text),
  state: () => st, ui: () => ui, voice: () => voice.engine, ai: () => ({on: aiOn(), calls: ai.calls, fails: ai.fails, last: ai.last}) };

resetIdle();
render();
})();
